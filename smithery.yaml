# Smithery configuration — https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
      - apiSecret
    properties:
      apiKey:
        type: string
        description: GoDaddy Production API key (from developer.godaddy.com/keys)
      apiSecret:
        type: string
        description: GoDaddy Production API secret (from developer.godaddy.com/keys)
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['godaddy-mcp'],
      env: {
        GODADDY_API_KEY: config.apiKey,
        GODADDY_API_SECRET: config.apiSecret
      }
    })
