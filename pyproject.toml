[project]
name = "godaddy-mcp"
version = "0.1.0"
description = "GoDaddy DNS MCP Server"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David", email = "davidcjw@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "godaddy", "dns", "claude", "ai", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/davidcjw/godaddy-mcp"
Repository = "https://github.com/davidcjw/godaddy-mcp"

[project.scripts]
godaddy-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
